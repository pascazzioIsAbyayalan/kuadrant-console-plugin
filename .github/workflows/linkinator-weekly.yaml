name: Documentation Link Check (Weekly)

# Weekly full-repo broken link scan.
# Referencing: https://github.com/Kuadrant/mcp-gateway/pull/952 & mcp-gateway/.github/workflows/linkinator-weekly.yaml

on:
  schedule:
    # Monday at 07:02 UTC
    - cron: '2 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-link-check:
    name: Full Documentation Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JustinBeckwith/linkinator-action@v2
        with:
          paths: "**/*.md"
          config: linkinator.config.json
