name: Documentation Link Check (Weekly)

# Weekly full-repo broken link scan.
# Referencing: https://github.com/Kuadrant/mcp-gateway/pull/952 & mcp-gateway/.github/workflows/linkinator-weekly.yaml

on:
  schedule:
    # Monday at 07:02 UTC
    - cron: '2 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-link-check:
    name: Full Documentation Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #ratchet: actions/checkout@v7

      - name: Run Linkinator
        id: linkinator
        uses: JustinBeckwith/linkinator-action@12f7a61a56e5e75d659f0dfd6357e2d852ede281
        with:
          paths: "**/*.md"
        continue-on-error: true
      
      - name: Extract summary stats
        if: steps.linkinator.outcome == 'failure'
        id: stats
        env: 
          LINKINATOR_RESULTS: ${{ steps.linkinator.outputs.results }}
        run: |
          echo "This works I guess"
          echo "$LINKINATOR_RESULTS"

      - name: Hate GH Actions
        if: steps.linkinator.outcome == 'failure'
        id: hate
        run: | 
          exit 1
      
